name: Surge PR Preview

on: pull_request

jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
    - id: surge_preview
      uses: afc163/surge-preview@v1
      with:
        surge_token: ${{ secrets.SURGE_TOKEN }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        dist: docs-dist
        build: |
          yarn
          yarn docs:build

    - name: Comment PR with preview URL
      uses: actions/github-script@v6
      if: ${{ github.event_name == 'pull_request' }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const prNumber = context.payload.pull_request.number;
          // try common output names from surge-preview action
          const url = steps.surge_preview?.outputs?.preview_url || steps.surge_preview?.outputs?.url || '';
          const body = url ? `Preview site: ${url}` : 'Preview: (no URL returned by surge-preview action)';
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body,
          });
