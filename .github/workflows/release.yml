name: release

on:
  release:
    types: [created, edited]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 18
      - run: yarn
      - run: yarn ci
  publish-site:
    needs: build
    runs-on: ubuntu-latest
    # use Pages permissions so we can deploy without PAT and respect branch protection
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 18
      - run: yarn
      - run: yarn docs:build
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: docs-dist

  deploy-pages:
    needs: publish-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

